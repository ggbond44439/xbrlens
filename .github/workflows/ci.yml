name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
        with:
          moon-version: 0.10.18
      - name: Check
        run: moon check --target all
      - name: Test wasm
        run: moon test --target wasm
      - name: Test wasm-gc
        run: moon test --target wasm-gc
      - name: Test JS
        run: moon test --target js
      - name: Format
        run: moon fmt --check
      - name: Differential fixture check
        run: python scripts/differential_check.py